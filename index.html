<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="USCPA単語">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>USCPA Words</title>
<style>
:root{
  --bg:#fff; --bg2:#f2f2f7; --ink:#111; --ink2:#6e6e73; --ink3:#aeaeb2; --line:#e5e5ea;
  --green:#34c759; --green-d:#1f9d43; --green-bg:#e9f9ee;
  --red:#ff3b30; --red-d:#d70015; --red-bg:#ffedeb;
  --orange:#ff9500; --orange-d:#c93400; --orange-bg:#fff3e0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* ---------- scroll pages ---------- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 18px) 20px 24px}
.h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
.sub{color:var(--ink2);font-size:15px;margin:0 0 20px}
.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:26px 4px 10px}
.card{background:var(--bg2);border-radius:22px;padding:18px}

/* stats */
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.big span{color:var(--ink2);font-size:15px;font-weight:600}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#dcdce1;margin:14px 0 12px}
.seg i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.legend div{display:flex;align-items:center;gap:6px}
.legend em{font-style:normal;color:var(--ink);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.c-new{background:#c7c7cc}.c-learning{background:var(--orange)}.c-master{background:var(--green)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:99px;background:var(--bg2);font-size:15px;font-weight:600;color:var(--ink);display:flex;gap:6px;align-items:center;transition:transform .12s}
.chip small{font-size:13px;color:var(--ink2);font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.chip.on small{color:#ffffffb0}
.chip:active{transform:scale(.96)}

/* buttons */
.cta-wrap{padding:10px 20px 12px;background:linear-gradient(#fff0,#fff 30%)}
.btn{width:100%;height:58px;border-radius:18px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;letter-spacing:.01em;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98);opacity:.9}
.btn[disabled]{background:#d1d1d6;color:#fff}
.btn.ghost{background:var(--bg2);color:var(--ink)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}

/* tab bar */
.tabs{display:flex;border-top:1px solid var(--line);background:#fffffff2;padding:6px 8px calc(var(--sab) + 4px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink3);font-size:11px;font-weight:600}
.tabs button.on{color:var(--ink)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* list */
.search{width:100%;height:44px;border-radius:12px;border:0;background:var(--bg2);padding:0 14px;font-size:16px;margin:0 0 12px;outline:none;-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row .en{font-size:17px;font-weight:700;letter-spacing:-.01em}
.row .ja{font-size:14px;color:var(--ink2);margin-top:2px}
.row .r{text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.row .n{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-new{background:var(--bg2);color:var(--ink2)}
.p-learning{background:var(--orange-bg);color:var(--orange-d)}
.p-master{background:var(--green-bg);color:var(--green-d)}
.p-weak{background:var(--red-bg);color:var(--red-d)}
.empty{text-align:center;color:var(--ink2);padding:48px 0;font-size:15px;line-height:1.7}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.set-row+.set-row{border-top:1px solid var(--line);margin-top:10px;padding-top:16px}
.set-row b{font-size:16px}
.set-row p{margin:2px 0 0;font-size:13px;color:var(--ink2);line-height:1.5}
.seg2{display:flex;background:#e3e3e8;border-radius:10px;padding:2px}
.seg2 button{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:700;color:var(--ink2)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.link{color:var(--ink);font-weight:600;font-size:16px;padding:12px 0;text-align:left;width:100%}
.link.red{color:var(--red-d)}
.note{font-size:13px;color:var(--ink2);line-height:1.7;padding:0 4px}

/* ---------- quiz ---------- */
.quiz{flex:1;display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) 18px calc(var(--sab) + 14px);min-height:0}
.qtop{display:flex;align-items:center;gap:12px;height:40px}
.x{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round}
.bar{flex:1;height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s ease}
.cnt{font-size:13px;color:var(--ink2);font-weight:700;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.round{margin:10px 0 0;text-align:center;height:22px;font-size:13px;font-weight:700;color:var(--orange-d)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:0 6px;min-height:0}
.word{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.12;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;word-break:break-word;animation:in .22s ease}
.word.m{font-size:34px}.word.l{font-size:29px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spk{width:44px;height:44px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.spk svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.streak{display:flex;gap:6px;align-items:center;height:14px}
.streak i{width:22px;height:5px;border-radius:9px;background:#e3e3e8}
.streak i.f{background:var(--ink)}
.streak.m i.f{background:var(--green)}
.fb{height:22px;font-size:15px;font-weight:700}
.fb.ok{color:var(--green-d)}.fb.ng{color:var(--red-d)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 16px;border-radius:18px;background:var(--bg2);text-align:left;font-size:18px;font-weight:600;line-height:1.35;box-shadow:inset 0 0 0 2px transparent;transition:transform .1s,background .15s,box-shadow .15s,opacity .15s}
.choice:active{transform:scale(.985)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink2);font-size:13px;font-weight:700;display:grid;place-items:center}
.choice.ok{background:var(--green-bg);box-shadow:inset 0 0 0 2px var(--green);color:var(--green-d)}
.choice.ng{background:var(--red-bg);box-shadow:inset 0 0 0 2px var(--red);color:var(--red-d)}
.choice.ok .k{background:var(--green);color:#fff}
.choice.ng .k{background:var(--red);color:#fff}
.choice.dim{opacity:.4}
.choice[disabled]{cursor:default}
.slot{height:58px;margin-top:12px}
.slot .btn{animation:in .18s ease}

/* interlude / result */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 28px;gap:10px}
.center h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0}
.center p{margin:0;color:var(--ink2);font-size:16px;line-height:1.7}
.bottom{padding:12px 20px calc(var(--sab) + 14px);display:flex;flex-direction:column;gap:10px}
.pct{font-size:88px;font-weight:800;letter-spacing:-.05em;line-height:1}
.pct small{font-size:36px;font-weight:700;letter-spacing:-.02em}
.res{display:flex;gap:10px;width:100%;margin-top:18px}
.res div{flex:1;background:var(--bg2);border-radius:18px;padding:14px 8px}
.res b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em}
.res span{font-size:12px;color:var(--ink2);font-weight:600}
.miss{width:100%;text-align:left;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.word{font-size:36px}.word.m{font-size:30px}.word.l{font-size:26px}.choice{min-height:54px}}
</style>
</head>
<body>
<div id="app"></div>

<script src="words.js"></script>
<script>
(() => {
'use strict';

/* ================= 設定 ================= */
const MASTER = 3;                 // 習得に必要な「連続正解」回数（1回正解しただけでは習得にならない）
const PK = 'uscpa.progress.v1';   // 学習記録の保存キー
const CK = 'uscpa.cfg.v1';

/* ================= ユーティリティ ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ld = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v && typeof v === 'object' ? v : d; } catch (e) { return d; } };

let progress = ld(PK, {});   // { id: { c:正解数, w:不正解数, s:連続正解, last:直近(1/0) } }
let cfg = Object.assign({ n: 20, pool: 'all' }, ld(CK, {}));
const save = () => { try { localStorage.setItem(PK, JSON.stringify(progress)); localStorage.setItem(CK, JSON.stringify(cfg)); } catch (e) {} };

/* ================= 単語データ読み込み ================= */
const seen = new Set();
const WL = (typeof WORDS !== 'undefined' ? WORDS : [])
  .map(a => ({ id: String(a[0]).trim().toLowerCase(), en: String(a[0]).trim(), ja: String(a[1]).trim(), wrong: (a[2] || []).map(x => String(x).trim()) }))
  .filter(w => w.en && w.ja && !seen.has(w.id) && seen.add(w.id));
const byId = Object.fromEntries(WL.map(w => [w.id, w]));

/* ================= 習熟度 ================= */
const status = id => { const p = progress[id]; if (!p || p.c + p.w === 0) return 'new'; return p.s >= MASTER ? 'master' : 'learning'; };
const isWeak = id => { const p = progress[id]; return !!p && status(id) !== 'master' && p.w > 0 && (p.last === 0 || p.w >= p.c); };
const inPool = (id, pool) => pool === 'all' ? true : pool === 'weak' ? isWeak(id) : status(id) === pool;
const LABEL = { new: '未学習', learning: '学習中', master: '習得', weak: '苦手', all: 'すべて' };
const counts = () => { const c = { new: 0, learning: 0, master: 0, weak: 0, all: WL.length }; WL.forEach(w => { c[status(w.id)]++; if (isWeak(w.id)) c.weak++; }); return c; };

function record(id, ok) {
  const p = progress[id] || (progress[id] = { c: 0, w: 0, s: 0, last: null });
  if (ok) { p.c++; p.s++; p.last = 1; } else { p.w++; p.s = 0; p.last = 0; }
  save();
}

/* ================= 出題 ================= */
function pickWords(pool, n) {
  const scored = WL.filter(w => inPool(w.id, pool)).map(w => {
    const st = status(w.id);
    const base = isWeak(w.id) ? 4 : st === 'new' ? 3 : st === 'learning' ? 2 : 0.7;
    return { w, s: base + Math.random() * 2.5 };
  });
  scored.sort((a, b) => b.s - a.s);
  return shuffle(scored.slice(0, n).map(x => x.w));
}
function makeChoices(w) {
  let wr = shuffle([...new Set(w.wrong.filter(x => x && x !== w.ja))]).slice(0, 3);
  if (wr.length < 3) {   // 不正解が足りなければ他の単語の日本語で補う
    const pool = shuffle([...new Set(WL.filter(o => o.id !== w.id && o.ja !== w.ja).map(o => o.ja))]).filter(t => !wr.includes(t));
    while (wr.length < 3 && pool.length) wr.push(pool.shift());
  }
  return shuffle([w.ja, ...wr]).map(t => ({ t, ok: t === w.ja }));
}
const speak = t => { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} };

/* ================= 画面状態 ================= */
const ui = { tab: 'study', screen: 'tabs', lf: 'all', q: '' };
let S = null;   // 学習セッション

const I = {
  study: '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 8.5h8M8 12.5h8M8 16.5h4"/></svg>',
  list: '<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  set: '<svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  spk: '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg>'
};

/* ================= 描画: タブ画面 ================= */
const tabbar = () => `<nav class="tabs">${[['study', '学習', I.study], ['list', '単語', I.list], ['set', '設定', I.set]]
  .map(([k, l, ic]) => `<button data-act="tab" data-v="${k}" class="${ui.tab === k ? 'on' : ''}">${ic}<span>${l}</span></button>`).join('')}</nav>`;

function studyHTML() {
  const c = counts(), tot = WL.length || 1;
  let cs = 0, ws = 0; Object.keys(progress).forEach(id => { if (byId[id]) { cs += progress[id].c; ws += progress[id].w; } });
  const acc = cs + ws ? Math.round(cs / (cs + ws) * 100) : null;
  const chips = ['all', 'new', 'learning', 'weak', 'master'].map(k =>
    `<button class="chip ${cfg.pool === k ? 'on' : ''}" data-act="pool" data-v="${k}">${LABEL[k]}<small>${c[k]}</small></button>`).join('');
  return `
    <h1 class="h1">USCPA Words</h1>
    <p class="sub">英語 → 日本語</p>
    <div class="card">
      <div class="big"><b>${c.master}</b><span>/ ${WL.length} 語 習得</span></div>
      <div class="seg"><i class="c-master" style="width:${c.master / tot * 100}%"></i><i class="c-learning" style="width:${c.learning / tot * 100}%"></i></div>
      <div class="legend">
        <div><span class="dot c-new"></span>未学習 <em>${c.new}</em></div>
        <div><span class="dot c-learning"></span>学習中 <em>${c.learning}</em></div>
        <div><span class="dot c-master"></span>習得 <em>${c.master}</em></div>
        <div>累計正答率 <em>${acc === null ? '–' : acc + '%'}</em></div>
      </div>
    </div>
    <div class="sec">出題する単語</div>
    <div class="chips">${chips}</div>
    <p class="note" style="margin-top:22px">連続${MASTER}回正解すると「習得」になります。間違えると「学習中」に戻ります。</p>`;
}
function ctaHTML() {
  const n = WL.filter(w => inPool(w.id, cfg.pool)).length;
  return `<div class="cta-wrap"><button class="btn" data-act="start" ${n ? '' : 'disabled'}>${n ? Math.min(cfg.n, n) + '問 スタート' : '該当する単語がありません'}</button></div>`;
}
function listHTML() {
  const c = counts();
  const chips = ['all', 'new', 'learning', 'weak', 'master'].map(k =>
    `<button class="chip ${ui.lf === k ? 'on' : ''}" data-act="lf" data-v="${k}">${LABEL[k]}<small>${c[k]}</small></button>`).join('');
  return `<h1 class="h1">単語</h1><p class="sub">タップで発音</p>
    <input class="search" id="q" type="search" placeholder="検索" value="${esc(ui.q)}" autocomplete="off" autocapitalize="off">
    <div class="chips" style="margin-bottom:8px">${chips}</div><div id="listBody"></div>`;
}
function fillList() {
  const q = ui.q.trim().toLowerCase();
  const ws = WL.filter(w => inPool(w.id, ui.lf) && (!q || w.en.toLowerCase().includes(q) || w.ja.includes(q)));
  $('#listBody').innerHTML = ws.length ? ws.map(w => {
    const p = progress[w.id] || { c: 0, w: 0 }, st = status(w.id);
    return `<button class="row" data-act="speak" data-v="${esc(w.en)}">
      <div class="t"><div class="en">${esc(w.en)}</div><div class="ja">${esc(w.ja)}</div></div>
      <div class="r"><div><span class="pill p-${st}">${LABEL[st]}</span>${isWeak(w.id) ? ' <span class="pill p-weak">苦手</span>' : ''}</div><div class="n">○ ${p.c}　✕ ${p.w}</div></div></button>`;
  }).join('') : '<div class="empty">該当する単語はありません</div>';
}
function settingsHTML() {
  return `<h1 class="h1">設定</h1><p class="sub">&nbsp;</p>
    <div class="card">
      <div class="set-row"><div><b>1回の問題数</b><p>間違えた問題は最後に復習します</p></div>
        <div class="seg2">${[10, 20, 30].map(n => `<button data-act="n" data-v="${n}" class="${cfg.n === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    </div>
    <div class="sec">学習記録</div>
    <div class="card" style="padding:6px 18px">
      <button class="link" data-act="copy">記録をコピー（バックアップ）</button>
      <button class="link" data-act="restore" style="border-top:1px solid var(--line)">記録を貼り付けて復元</button>
      <button class="link red" data-act="reset" style="border-top:1px solid var(--line)">記録をすべてリセット</button>
    </div>
    <div class="sec">単語の追加方法</div>
    <p class="note">words.js の内容をClaudeなどのAIに貼り付けて、新しい英単語と意味を伝えてください。AIが単語を追加し、4択の選択肢もすべて作り直した words.js を返します。それをGitHubの words.js に上書き保存すると反映されます。学習記録は英単語のスペルで引き継がれます。</p>
    <p class="note" style="margin-top:14px">登録単語 ${WL.length} 語 ・ 更新日 ${esc(typeof WORDS_UPDATED !== 'undefined' ? WORDS_UPDATED : '-')}</p>`;
}

/* ================= 描画: 学習画面 ================= */
function quizHTML() {
  const { w, choices, picked } = S.cur, done = picked !== null, ok = done && choices[picked].ok;
  const len = w.en.length, cls = len > 24 ? 'l' : len > 12 ? 'm' : '';
  const p = progress[w.id], streak = p ? Math.min(p.s, MASTER) : 0, mastered = streak >= MASTER;
  const pct = (S.idx + (done ? 1 : 0)) / S.queue.length * 100;
  return `<div class="quiz">
    <div class="qtop"><button class="x" data-act="quit" aria-label="中断">${I.x}</button>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="cnt">${S.idx + 1} / ${S.queue.length}</div></div>
    <div class="round">${S.round > 1 ? '復習 ' + (S.round - 1) + '回目' : ''}</div>
    <div class="stage">
      <div class="word ${cls}" id="wd">${esc(w.en)}</div>
      <button class="spk" data-act="speak" data-v="${esc(w.en)}" aria-label="発音">${I.spk}</button>
      <div class="streak ${mastered ? 'm' : ''}" title="連続正解">${Array.from({ length: MASTER }, (_, i) => `<i class="${i < streak ? 'f' : ''}"></i>`).join('')}</div>
      <div class="fb ${done ? (ok ? 'ok' : 'ng') : ''}">${done ? (ok ? '正解' : '不正解') : ''}</div>
    </div>
    <div class="choices">${choices.map((c, i) => {
      let k = ''; if (done) k = c.ok ? 'ok' : i === picked ? 'ng' : 'dim';
      return `<button class="choice ${k}" data-act="pick" data-v="${i}" ${done ? 'disabled' : ''}><span class="k">${i + 1}</span><span>${esc(c.t)}</span></button>`;
    }).join('')}</div>
    <div class="slot">${done && !ok ? '<button class="btn" data-act="next">次へ</button>' : ''}</div>
  </div>`;
}
const interHTML = () => `<div class="center"><h2>間違えた問題を<br>復習します</h2><p>${S.queue.length}問<br>すべて正解するまで続きます</p></div>
  <div class="bottom"><button class="btn" data-act="cont">続ける</button></div>`;

function resultHTML() {
  const fc = Object.values(S.first).filter(Boolean).length, pct = Math.round(fc / S.total * 100);
  const allT = S.all.c + S.all.w, allPct = allT ? Math.round(S.all.c / allT * 100) : 0;
  const gain = Object.keys(S.before).filter(id => S.before[id] !== 'master' && status(id) === 'master').length;
  const missed = Object.keys(S.first).filter(id => !S.first[id]).map(id => byId[id]);
  const msg = pct === 100 ? 'パーフェクト' : pct >= 80 ? 'いい調子です' : pct >= 60 ? 'あと一歩です' : '復習で定着させましょう';
  return `<div class="scroll" style="display:flex;flex-direction:column;align-items:center;text-align:center">
    <p class="sub" style="margin-top:28px">${msg}</p>
    <div class="pct">${pct}<small>%</small></div>
    <p class="sub" style="margin:8px 0 0">初回正答率 ${fc} / ${S.total} 問</p>
    <div class="res">
      <div><b>${S.round - 1}</b><span>復習ラウンド</span></div>
      <div><b>${allPct}%</b><span>復習込み正答率</span></div>
      <div><b>+${gain}</b><span>新たに習得</span></div>
    </div>
    ${missed.length ? `<div class="miss"><div class="sec" style="margin-top:24px">今回間違えた単語</div>${missed.map(w =>
      `<button class="row" data-act="speak" data-v="${esc(w.en)}"><div class="t"><div class="en">${esc(w.en)}</div><div class="ja">${esc(w.ja)}</div></div></button>`).join('')}</div>` : ''}
  </div>
  <div class="bottom"><button class="btn" data-act="start">もう一度</button><button class="btn ghost" data-act="home">ホームへ</button></div>`;
}

function render() {
  const a = $('#app');
  if (ui.screen === 'quiz') a.innerHTML = quizHTML();
  else if (ui.screen === 'inter') a.innerHTML = interHTML();
  else if (ui.screen === 'result') a.innerHTML = resultHTML();
  else {
    const body = ui.tab === 'study' ? studyHTML() : ui.tab === 'list' ? listHTML() : settingsHTML();
    a.innerHTML = `<main class="scroll" id="sc">${body}</main>${ui.tab === 'study' ? ctaHTML() : ''}${tabbar()}`;
    if (ui.tab === 'list') fillList();
  }
}

/* ================= 学習フロー ================= */
function start() {
  const ws = pickWords(cfg.pool, cfg.n);
  if (!ws.length) return;
  S = { round: 1, queue: ws.map(w => w.id), idx: 0, total: ws.length, wrong: [], first: {}, all: { c: 0, w: 0 }, before: Object.fromEntries(ws.map(w => [w.id, status(w.id)])), cur: null, timer: null };
  showQ();
}
function showQ() {
  const w = byId[S.queue[S.idx]];
  S.cur = { w, choices: makeChoices(w), picked: null };
  ui.screen = 'quiz'; render();
}
function pick(i) {
  if (!S || !S.cur || S.cur.picked !== null) return;
  const { w, choices } = S.cur, ok = choices[i].ok;
  S.cur.picked = i;
  record(w.id, ok);
  if (!(w.id in S.first)) S.first[w.id] = ok;
  ok ? S.all.c++ : S.all.w++;
  if (!ok && !S.wrong.includes(w.id)) S.wrong.push(w.id);
  render();
  if (ok) S.timer = setTimeout(next, 650);
}
function next() {
  clearTimeout(S.timer);
  if (S.idx + 1 < S.queue.length) { S.idx++; showQ(); return; }
  if (S.wrong.length) {                       // 間違えたものがあれば、できるまで復習ラウンド
    S.round++; S.queue = shuffle(S.wrong); S.wrong = []; S.idx = 0;
    ui.screen = 'inter'; render(); return;
  }
  ui.screen = 'result'; render();
}

/* ================= イベント ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'tab': ui.tab = v; ui.screen = 'tabs'; render(); break;
    case 'pool': cfg.pool = v; save(); render(); break;
    case 'lf': ui.lf = v; render(); break;
    case 'n': cfg.n = +v; save(); render(); break;
    case 'start': start(); break;
    case 'pick': pick(+v); break;
    case 'next': next(); break;
    case 'cont': showQ(); break;
    case 'home': ui.screen = 'tabs'; ui.tab = 'study'; render(); break;
    case 'speak': speak(v); break;
    case 'quit': if (confirm('学習を中断しますか？\nここまでの記録は保存されています。')) { clearTimeout(S && S.timer); ui.screen = 'tabs'; render(); } break;
    case 'reset': if (confirm('学習記録をすべて消します。よろしいですか？')) { progress = {}; save(); render(); } break;
    case 'copy': (navigator.clipboard ? navigator.clipboard.writeText(JSON.stringify(progress)) : Promise.reject()).then(() => alert('コピーしました。メモアプリなどに保存してください。')).catch(() => prompt('コピーして保存してください', JSON.stringify(progress))); break;
    case 'restore': { const t = prompt('コピーした記録を貼り付けてください'); if (t) { try { const o = JSON.parse(t); if (o && typeof o === 'object') { progress = o; save(); alert('復元しました'); render(); } } catch (err) { alert('読み込めませんでした。コピーした内容をそのまま貼り付けてください。'); } } break; }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; fillList(); } });
document.addEventListener('keydown', e => {
  if (ui.screen !== 'quiz' || !S || !S.cur) return;
  if (/^[1-4]$/.test(e.key)) pick(+e.key - 1);
  else if (e.key === 'Enter' && S.cur.picked !== null) next();
});

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
